<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111827">
<meta name="description" content="SARVESH AI assistant created by Sarvesh Ghane">
<title>SARVESH AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:700px;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#fff;
  overflow:hidden;
}

/* HEADER */
.header{
  height:70px;
  flex-shrink:0;
  background:#111827;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
}

.brandText{
  display:flex;
  flex-direction:column;
}

.brandName{
  font-size:19px;
  font-weight:700;
}

.creator{
  font-size:11px;
  opacity:.75;
  margin-top:2px;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  opacity:.8;
}

.statusDot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:18px 14px 12px;
  background:#f7f8fc;
  scroll-behavior:smooth;
}

.welcome{
  text-align:center;
  padding:35px 20px;
  color:#6b7280;
}

.welcomeIcon{
  width:64px;
  height:64px;
  border-radius:20px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:white;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
}

.welcome h2{
  color:#111827;
  font-size:22px;
  margin-bottom:8px;
}

.welcome p{
  font-size:14px;
  line-height:1.5;
}

.messageRow{
  display:flex;
  margin:9px 0;
}

.messageRow.user{
  justify-content:flex-end;
}

.message{
  max-width:82%;
  padding:11px 14px;
  border-radius:17px;
  font-size:15px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message.ai{
  background:white;
  color:#1f2937;
  border:1px solid #e5e7eb;
  border-bottom-left-radius:5px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}

.message.user{
  background:#111827;
  color:white;
  border-bottom-right-radius:5px;
}

.time{
  font-size:9px;
  opacity:.5;
  margin-top:4px;
  text-align:right;
}

/* TYPING */
.typing{
  display:none;
  align-items:center;
  gap:5px;
  width:max-content;
  background:white;
  border:1px solid #e5e7eb;
  border-radius:17px;
  padding:12px 15px;
  margin:8px 0;
}

.typing.show{
  display:flex;
}

.typing span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#777;
  animation:bounce 1.2s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,60%,100%{transform:translateY(0)}
  30%{transform:translateY(-5px)}
}

/* INPUT */
.inputArea{
  flex-shrink:0;
  padding:10px 11px 12px;
  background:white;
  border-top:1px solid #e5e7eb;
}

.inputBox{
  display:flex;
  align-items:flex-end;
  gap:7px;
  background:#f3f4f6;
  border:1px solid #e5e7eb;
  border-radius:25px;
  padding:6px 7px 6px 14px;
}

textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  font-family:inherit;
  font-size:15px;
  line-height:22px;
  min-height:22px;
  max-height:110px;
  padding:5px 0;
}

.iconBtn{
  width:40px;
  height:40px;
  flex-shrink:0;
  border:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  cursor:pointer;
}

.mic{
  background:#e5e7eb;
  color:#111827;
}

.mic.listening{
  background:#ef4444;
  color:white;
}

.send{
  background:#111827;
  color:white;
}

.iconBtn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.footerText{
  text-align:center;
  font-size:9px;
  color:#9ca3af;
  margin-top:6px;
}

/* MOBILE */
@media(max-width:480px){
  .header{
    height:64px;
    padding:0 13px;
  }

  .logo{
    width:39px;
    height:39px;
  }

  .brandName{
    font-size:17px;
  }

  .message{
    max-width:88%;
  }

  .chat{
    padding-left:10px;
    padding-right:10px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo">S</div>

      <div class="brandText">
        <div class="brandName">SARVESH AI</div>
        <div class="creator">Created by Sarvesh Ghane</div>
      </div>
    </div>

    <div class="status">
      <span class="statusDot"></span>
      Online
    </div>
  </header>

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">
      <div class="welcomeIcon">S</div>
      <h2>Hello! I'm SARVESH AI</h2>
      <p>
        Ask me anything. Type your message or use the microphone.
      </p>
    </div>

    <div class="typing" id="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </main>

  <div class="inputArea">

    <div class="inputBox">

      <textarea
        id="messageInput"
        rows="1"
        placeholder="Message SARVESH AI..."
        autocomplete="off"
      ></textarea>

      <button
        class="iconBtn mic"
        id="micBtn"
        title="Voice input"
        type="button"
      >🎤</button>

      <button
        class="iconBtn send"
        id="sendBtn"
        title="Send"
        type="button"
      >➤</button>

    </div>

    <div class="footerText">
      SARVESH AI • Created by Sarvesh Ghane
    </div>

  </div>

</div>

<script>

/* =========================================================
   SARVESH AI
   Website → Cloudflare Worker → OpenRouter
   ========================================================= */

const WORKER_URL =
  "https://sarvesh-ai-backend.sarveshghane77.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const typing = document.getElementById("typing");
const welcome = document.getElementById("welcome");

let conversation = [];
let isSending = false;


/* =========================================================
   TIME
   ========================================================= */

function getTime(){

  return new Date().toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });

}


/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(role,text){

  if(welcome){
    welcome.style.display="none";
  }

  const row = document.createElement("div");

  row.className =
    "messageRow " +
    (role === "user" ? "user" : "ai");

  const bubble = document.createElement("div");

  bubble.className =
    "message " +
    (role === "user" ? "user" : "ai");

  bubble.textContent = text;

  const time = document.createElement("div");

  time.className="time";
  time.textContent=getTime();

  bubble.appendChild(time);
  row.appendChild(bubble);

  chat.insertBefore(row,typing);

  chat.scrollTop=chat.scrollHeight;

}


/* =========================================================
   TYPING
   ========================================================= */

function showTyping(){

  typing.classList.add("show");

  chat.scrollTop=chat.scrollHeight;

}


function hideTyping(){

  typing.classList.remove("show");

}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage(){

  const text=input.value.trim();

  if(!text || isSending){
    return;
  }

  isSending=true;
  sendBtn.disabled=true;

  addMessage("user",text);

  conversation.push({
    role:"user",
    content:text
  });

  input.value="";
  input.style.height="auto";

  showTyping();

  try{

    const history = conversation.slice(-12);

    const response = await fetch(WORKER_URL,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        message:text,
        history:history
      })

    });


    let data;

    try{
      data=await response.json();
    }catch{
      throw new Error("The server returned an invalid response.");
    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "AI server error. Please try again."
      );

    }


    if(!data.reply){

      throw new Error(
        "SARVESH AI did not return a reply."
      );

    }


    conversation.push({
      role:"assistant",
      content:data.reply
    });

    hideTyping();

    addMessage("assistant",data.reply);

    speak(data.reply);

  }catch(error){

    hideTyping();

    console.error(error);

    let message =
      "Sorry, I couldn't connect to SARVESH AI right now.";

    if(
      error.message &&
      error.message.length < 200
    ){
      message += "\n\n" + error.message;
    }

    addMessage("assistant",message);

  }finally{

    isSending=false;
    sendBtn.disabled=false;
    input.focus();

  }

}


/* =========================================================
   SEND BUTTON
   ========================================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================================================
   ENTER TO SEND
   ========================================================= */

input.addEventListener("keydown",function(e){

  if(e.key==="Enter" && !e.shiftKey){

    e.preventDefault();

    sendMessage();

  }

});


/* =========================================================
   AUTO RESIZE TEXTAREA
   ========================================================= */

input.addEventListener("input",function(){

  this.style.height="auto";

  this.style.height =
    Math.min(this.scrollHeight,110) + "px";

});


/* =========================================================
   SPEECH OUTPUT
   ========================================================= */

function speak(text){

  if(!("speechSynthesis" in window)){
    return;
  }

  try{

    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.rate=1;
    utterance.pitch=1;
    utterance.volume=1;

    window.speechSynthesis.speak(utterance);

  }catch(error){

    console.log("Speech output unavailable");

  }

}


/* =========================================================
   VOICE INPUT
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition=null;
let listening=false;


if(SpeechRecognition){

  recognition=new SpeechRecognition();

  recognition.lang="en-IN";

  recognition.continuous=false;

  recognition.interimResults=false;


  recognition.onstart=function(){

    listening=true;

    micBtn.classList.add("listening");

    micBtn.textContent="⏹";

  };


  recognition.onresult=function(event){

    const result =
      event.results[0][0].transcript;

    input.value=result;

    input.dispatchEvent(
      new Event("input")
    );

  };


  recognition.onerror=function(event){

    console.log(
      "Speech recognition error:",
      event.error
    );

  };


  recognition.onend=function(){

    listening=false;

    micBtn.classList.remove("listening");

    micBtn.textContent="🎤";

  };


  micBtn.addEventListener("click",function(){

    if(listening){

      recognition.stop();

      return;

    }

    try{

      recognition.start();

    }catch(error){

      console.log(error);

    }

  });

}else{

  micBtn.addEventListener("click",function(){

    alert(
      "Voice input is not supported by this browser."
    );

  });

}


/* =========================================================
   LOAD SAVED CHAT
   ========================================================= */

try{

  const saved =
    localStorage.getItem("sarvesh_ai_chat");

  if(saved){

    conversation=JSON.parse(saved);

    conversation.forEach(item=>{

      if(
        item.role==="user" ||
        item.role==="assistant"
      ){

        addMessage(
          item.role,
          item.content
        );

      }

    });

  }

}catch(error){

  console.log("No saved chat");

}


/* =========================================================
   SAVE CHAT
   ========================================================= */

setInterval(function(){

  try{

    localStorage.setItem(
      "sarvesh_ai_chat",
      JSON.stringify(
        conversation.slice(-30)
      )
    );

  }catch(error){

    console.log("Could not save chat");

  }

},2000);


/* =========================================================
   FOCUS INPUT
   ========================================================= */

input.focus();

</script>

</body>
</html>
