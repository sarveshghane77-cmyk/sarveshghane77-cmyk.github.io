<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>SARVESH AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f7f7f8;
  height:100vh;
  overflow:hidden;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  height:64px;
  background:#111827;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  flex-shrink:0;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logoIcon{
  width:38px;
  height:38px;
  border-radius:50%;
  background:white;
  color:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.logoText{
  font-size:20px;
  font-weight:700;
}

.creator{
  font-size:11px;
  opacity:.75;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 110px;
}

.message{
  display:flex;
  margin-bottom:18px;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:85%;
  padding:13px 15px;
  border-radius:18px;
  line-height:1.45;
  font-size:15px;
  white-space:pre-wrap;
}

.ai .bubble{
  background:white;
  color:#222;
  border:1px solid #e5e7eb;
  border-bottom-left-radius:5px;
}

.user .bubble{
  background:#111827;
  color:white;
  border-bottom-right-radius:5px;
}

.welcome{
  text-align:center;
  padding:70px 20px 30px;
}

.welcomeIcon{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:50%;
  background:#111827;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}

.welcome h1{
  margin-top:18px;
  font-size:27px;
}

.welcome p{
  margin-top:8px;
  color:#777;
}

.inputArea{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:rgba(247,247,248,.96);
  padding:10px 12px 14px;
  border-top:1px solid #ddd;
}

.inputBox{
  max-width:800px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:7px;
  background:white;
  border:1px solid #d5d5d5;
  border-radius:25px;
  padding:6px 7px 6px 14px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

#input{
  flex:1;
  border:none;
  outline:none;
  font-size:15px;
  min-width:0;
}

button{
  border:none;
  cursor:pointer;
}

.iconBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#f1f1f1;
  font-size:19px;
}

.sendBtn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#111827;
  color:white;
  font-size:18px;
}

.listening{
  background:#dc2626 !important;
  color:white;
}

.footer{
  text-align:center;
  font-size:10px;
  color:#999;
  margin-top:5px;
}

.typing{
  display:flex;
  gap:4px;
  padding:4px;
}

.typing span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#999;
  animation:bounce 1s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes bounce{
  0%,80%,100%{transform:scale(.7)}
  40%{transform:scale(1)}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">
    <div class="logoIcon">S</div>
    <div>
      <div class="logoText">SARVESH AI</div>
      <div class="creator">Created by Sarvesh Ghane</div>
    </div>
  </div>
</header>

<main class="chat" id="chat">

  <div class="welcome" id="welcome">
    <div class="welcomeIcon">S</div>
    <h1>How can I help you?</h1>
    <p>I'm SARVESH AI, created by Sarvesh Ghane.</p>
  </div>

</main>

<div class="inputArea">

  <div class="inputBox">

    <button class="iconBtn"
            id="micBtn"
            onclick="toggleVoice()"
            title="Voice input">
      🎤
    </button>

    <input
      id="input"
      type="text"
      placeholder="Message SARVESH AI..."
      autocomplete="off"
    >

    <button class="sendBtn"
            onclick="sendMessage()">
      ➤
    </button>

  </div>

  <div class="footer">
    SARVESH AI • Created by Sarvesh Ghane
  </div>

</div>

</div>

<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const micBtn = document.getElementById("micBtn");
const welcome = document.getElementById("welcome");

let recognition = null;
let listening = false;

input.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    e.preventDefault();
    sendMessage();
  }
});


function addMessage(text,type){

  if(welcome){
    welcome.style.display="none";
  }

  const message=document.createElement("div");
  message.className="message "+type;

  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=text;

  message.appendChild(bubble);
  chat.appendChild(message);

  chat.scrollTop=chat.scrollHeight;

  return message;
}


function showTyping(){

  const message=document.createElement("div");
  message.className="message ai";
  message.id="typingMessage";

  const bubble=document.createElement("div");
  bubble.className="bubble";

  bubble.innerHTML=
    '<div class="typing">'+
    '<span></span><span></span><span></span>'+
    '</div>';

  message.appendChild(bubble);
  chat.appendChild(message);

  chat.scrollTop=chat.scrollHeight;
}


function removeTyping(){

  const typing=document.getElementById("typingMessage");

  if(typing){
    typing.remove();
  }
}


async function sendMessage(){

  const text=input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  input.value="";

  showTyping();

  /*
    TEMPORARY RESPONSE SYSTEM

    Your real AI backend will be connected here.
    I have deliberately not put a fake API key into this website.
  */

  setTimeout(function(){

    removeTyping();

    let reply="I'm SARVESH AI, created by Sarvesh Ghane. ";

    const lower=text.toLowerCase();

    if(lower.includes("creator") ||
       lower.includes("created you") ||
       lower.includes("developed you")){

      reply += "My creator and developer is Sarvesh Ghane.";

    }else if(lower.includes("your name")){

      reply += "My name is SARVESH AI.";

    }else if(lower.includes("who are you")){

      reply += "I am SARVESH AI, an AI assistant created by Sarvesh Ghane.";

    }else{

      reply += "Your AI connection is ready to be connected. Once we connect your AI backend, I will be able to answer your questions normally.";

    }

    addMessage(reply,"ai");

    speak(reply);

  },700);
}


/* =========================
   VOICE OUTPUT
========================= */

function speak(text){

  if(!("speechSynthesis" in window)){
    return;
  }

  speechSynthesis.cancel();

  const utterance=new SpeechSynthesisUtterance(text);

  utterance.lang="en-IN";
  utterance.rate=.95;
  utterance.pitch=1;

  speechSynthesis.speak(utterance);
}


/* =========================
   VOICE INPUT
========================= */

function setupRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert("Voice input is not supported by this browser.");

    return null;
  }

  const r=new SpeechRecognition();

  r.lang="en-IN";
  r.continuous=false;
  r.interimResults=false;

  r.onstart=function(){

    listening=true;

    micBtn.classList.add("listening");
    micBtn.textContent="⏹️";
  };

  r.onresult=function(event){

    const transcript =
      event.results[0][0].transcript;

    input.value=transcript;

    sendMessage();
  };

  r.onerror=function(){

    listening=false;

    micBtn.classList.remove("listening");
    micBtn.textContent="🎤";
  };

  r.onend=function(){

    listening=false;

    micBtn.classList.remove("listening");
    micBtn.textContent="🎤";
  };

  return r;
}


function toggleVoice(){

  if(!recognition){

    recognition=setupRecognition();

    if(!recognition) return;
  }

  if(listening){

    recognition.stop();

  }else{

    recognition.start();

  }
}

</script>

</body>
</html>
