/* =========================================================
   SARVESH AI
   Website → Cloudflare Worker → OpenRouter
   ========================================================= */

const WORKER_URL =
  "https://sarvesh-ai-backend.sarveshghane77.workers.dev";


const chat =
  document.getElementById("chat");

const input =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const micBtn =
  document.getElementById("micBtn");

const typing =
  document.getElementById("typing");

const welcome =
  document.getElementById("welcome");


let conversation=[];

let isSending=false;


/* =========================================================
   TIME
   ========================================================= */

function getTime(){

  return new Date().toLocaleTimeString([],{

    hour:"2-digit",
    minute:"2-digit"

  });

}


/* =========================================================
   CHECK WHETHER SOMETHING IS AN IMAGE URL
   ========================================================= */

function isImageUrl(value){

  if(typeof value!=="string"){
    return false;
  }

  const v=value.trim();

  if(
    v.startsWith("data:image/") ||
    v.startsWith("blob:") ||
    v.startsWith("https://") ||
    v.startsWith("http://")
  ){

    return true;

  }

  return false;

}


/* =========================================================
   FIND IMAGE IN SERVER RESPONSE
   ========================================================= */

function findImage(data){

  if(!data){
    return null;
  }


  /* Direct image fields */

  const directFields=[

    data.image,
    data.image_url,
    data.imageUrl,
    data.url,
    data.generated_image,
    data.generatedImage

  ];


  for(const item of directFields){

    if(isImageUrl(item)){
      return item;
    }

  }


  /* Array of images */

  if(Array.isArray(data.images)){

    for(const item of data.images){

      if(typeof item==="string" && isImageUrl(item)){
        return item;
      }


      if(item && typeof item==="object"){

        const possible=[

          item.url,
          item.image,
          item.image_url,
          item.imageUrl

        ];


        for(const value of possible){

          if(isImageUrl(value)){
            return value;
          }

        }

      }

    }

  }


  /* OpenRouter-style image data */

  if(data.data && Array.isArray(data.data)){

    for(const item of data.data){

      if(!item){
        continue;
      }


      if(typeof item==="string" && isImageUrl(item)){
        return item;
      }


      if(typeof item==="object"){

        const possible=[

          item.url,
          item.image,
          item.b64_json,
          item.image_url

        ];


        for(const value of possible){

          if(typeof value==="string"){

            if(
              value.startsWith("data:image/")
            ){

              return value;

            }


            /* Raw base64 image */

            if(
              value.length>200 &&
              /^[A-Za-z0-9+/=]+$/.test(value)
            ){

              return "data:image/png;base64,"+value;

            }


            if(isImageUrl(value)){
              return value;
            }

          }

        }

      }

    }

  }


  /* OpenAI/OpenRouter message content */

  if(
    data.choices &&
    Array.isArray(data.choices)
  ){

    for(const choice of data.choices){

      if(!choice){
        continue;
      }


      const content =
        choice.message &&
        choice.message.content;


      const found =
        findImageInsideContent(content);

      if(found){
        return found;
      }

    }

  }


  /* Search nested response */

  if(data.response){

    const found=findImage(data.response);

    if(found){
      return found;
    }

  }


  return null;

}


/* =========================================================
   FIND IMAGE INSIDE CONTENT
   ========================================================= */

function findImageInsideContent(content){

  if(!content){
    return null;
  }


  if(typeof content==="string"){

    /* Markdown image */

    const markdown=
      content.match(
        /![^]*\]([^)]+)/
      );


    if(markdown && isImageUrl(markdown[1])){
      return markdown[1];
    }


    /* Data URL */

    const dataUrl=
      content.match(
        /data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+/
      );


    if(dataUrl){
      return dataUrl[0];
    }


    /* Plain image URL */

    const urls=
      content.match(
        /https?:\/\/[^\s"'<>]+/g
      );


    if(urls){

      for(const url of urls){

        if(
          /\.(png|jpg|jpeg|webp|gif)(\?[^\s"'<>]*)?$/i
            .test(url)
        ){

          return url;

        }

      }

    }


    return null;

  }


  if(Array.isArray(content)){

    for(const part of content){

      const found=
        findImageInsideContent(part);

      if(found){
        return found;
      }

    }

  }


  if(typeof content==="object"){

    const direct=[

      content.url,
      content.image_url,
      content.image,
      content.b64_json

    ];


    for(const value of direct){

      if(typeof value==="string"){

        if(value.startsWith("data:image/")){
          return value;
        }


        if(
          value.length>200 &&
          /^[A-Za-z0-9+/=]+$/.test(value)
        ){

          return "data:image/png;base64,"+value;

        }


        if(isImageUrl(value)){
          return value;
        }

      }

    }


    for(const key of Object.keys(content)){

      const found=
        findImageInsideContent(content[key]);

      if(found){
        return found;
      }

    }

  }


  return null;

}


/* =========================================================
   CONVERT RAW BASE64 TO DATA URL
   ========================================================= */

function normalizeImage(image){

  if(!image){
    return null;
  }


  if(
    image.startsWith("data:image/")
  ){
    return image;
  }


  if(
    image.startsWith("http://") ||
    image.startsWith("https://") ||
    image.startsWith("blob:")
  ){

    return image;

  }


  /* Raw base64 */

  if(
    image.length>200 &&
    /^[A-Za-z0-9+/=]+$/.test(image)
  ){

    return "data:image/png;base64,"+image;

  }


  return image;

}


/* =========================================================
   DOWNLOAD IMAGE
   ========================================================= */

async function downloadImage(imageUrl){

  try{

    const response=
      await fetch(imageUrl);

    if(!response.ok){
      throw new Error("Could not download image.");
    }


    const blob=
      await response.blob();


    const blobUrl=
      URL.createObjectURL(blob);


    const link=
      document.createElement("a");

    link.href=blobUrl;

    link.download=
      "SARVESH-AI-image-" +
      Date.now() +
      ".png";


    document.body.appendChild(link);

    link.click();

    link.remove();


    setTimeout(function(){

      URL.revokeObjectURL(blobUrl);

    },1000);


  }catch(error){

    /* Fallback for remote images */

    try{

      const link=
        document.createElement("a");

      link.href=imageUrl;

      link.target="_blank";

      link.rel="noopener";

      link.download=
        "SARVESH-AI-image.png";

      document.body.appendChild(link);

      link.click();

      link.remove();

    }catch(e){

      alert(
        "Unable to download the image."
      );

    }

  }

}


/* =========================================================
   ADD IMAGE TO MESSAGE
   ========================================================= */

function addImageToBubble(bubble,imageUrl){

  const box=
    document.createElement("div");

  box.className=
    "generatedImageBox";


  const img=
    document.createElement("img");

  img.className=
    "generatedImage";

  img.alt=
    "Generated by SARVESH AI";

  img.loading="lazy";

  img.src=
    normalizeImage(imageUrl);


  img.onerror=function(){

    box.innerHTML="";

    const error=
      document.createElement("div");

    error.className="imageError";

    error.textContent=
      "⚠️ The generated image could not be displayed.";

    box.appendChild(error);

  };


  box.appendChild(img);


  const actions=
    document.createElement("div");

  actions.className=
    "imageActions";


  const downloadBtn=
    document.createElement("button");

  downloadBtn.type="button";

  downloadBtn.className=
    "downloadImageBtn";

  downloadBtn.innerHTML=
    "⬇️ Download Image";


  downloadBtn.addEventListener(
    "click",
    function(){

      downloadImage(
        normalizeImage(imageUrl)
      );

    }
  );


  actions.appendChild(downloadBtn);

  box.appendChild(actions);

  bubble.appendChild(box);

}


/* =========================================================
   CLEAN IMAGE MARKDOWN FROM TEXT
   ========================================================= */

function cleanImageText(text){

  if(typeof text!=="string"){
    return text;
  }


  return text

    .replace(
      /![^]*\]([^)]+)/g,
      ""
    )

    .trim();

}


/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(role,text,imageUrl=null){

  if(welcome){

    welcome.style.display="none";

  }


  const row=
    document.createElement("div");

  row.className=
    "messageRow " +
    (role==="user" ? "user" : "ai");


  const bubble=
    document.createElement("div");

  bubble.className=
    "message " +
    (role==="user" ? "user" : "ai");


  /* Add text */

  if(text){

    const cleanText=
      cleanImageText(text);


    if(cleanText){

      const textNode=
        document.createElement("div");

      textNode.textContent=
        cleanText;

      bubble.appendChild(textNode);

    }

  }


  /* Add image */

  if(imageUrl){

    addImageToBubble(
      bubble,
      imageUrl
    );

  }


  const time=
    document.createElement("div");

  time.className="time";

  time.textContent=
    getTime();


  bubble.appendChild(time);

  row.appendChild(bubble);


  chat.insertBefore(
    row,
    typing
  );


  chat.scrollTop=
    chat.scrollHeight;

}


/* =========================================================
   TYPING
   ========================================================= */

function showTyping(){

  typing.classList.add("show");

  chat.scrollTop=
    chat.scrollHeight;

}


function hideTyping(){

  typing.classList.remove("show");

}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage(){

  const text=
    input.value.trim();


  if(!text || isSending){
    return;
  }


  isSending=true;

  sendBtn.disabled=true;


  addMessage(
    "user",
    text
  );


  conversation.push({

    role:"user",

    content:text

  });


  input.value="";

  input.style.height="auto";


  showTyping();


  try{

    const history=
      conversation.slice(-12);


    const response=
      await fetch(
        WORKER_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:text,

            history:history

          })

        }
      );


    let data;


    try{

      data=
        await response.json();

    }catch{

      throw new Error(
        "The server returned an invalid response."
      );

    }


    console.log(
      "SARVESH AI response:",
      data
    );


    if(!response.ok){

      throw new Error(

        data.error ||
        "AI server error. Please try again."

      );

    }


    /*
       Find generated image BEFORE
       checking for normal reply.
    */

    const imageUrl=
      findImage(data);


    /*
       Get normal AI text.
    */

    let reply=
      data.reply ||
      data.message ||
      "";


    /*
       If Worker returned OpenRouter-style
       response directly.
    */

    if(
      !reply &&
      data.choices &&
      data.choices[0] &&
      data.choices[0].message
    ){

      const content=
        data.choices[0].message.content;


      if(typeof content==="string"){

        reply=content;

      }else{

        reply="";

      }

    }


    /*
       If only an image was returned,
       don't show an error.
    */

    if(!reply && !imageUrl){

      throw new Error(
        "SARVESH AI did not return a reply."
      );

    }


    conversation.push({

      role:"assistant",

      content:
        reply ||
        "[Generated image]"

    });


    hideTyping();


    /*
       IMPORTANT:
       Show image + text.
    */

    addMessage(
      "assistant",
      reply,
      imageUrl
    );


    /*
       Speak only normal text.
    */

    if(reply){

      speak(
        cleanImageText(reply)
      );

    }


  }catch(error){

    hideTyping();

    console.error(
      "SARVESH AI error:",
      error
    );


    let message=
      "Sorry, I couldn't connect to SARVESH AI right now.";


    if(
      error.message &&
      error.message.length<300
    ){

      message +=
        "\n\n" +
        error.message;

    }


    addMessage(
      "assistant",
      message
    );


  }finally{

    isSending=false;

    sendBtn.disabled=false;

    input.focus();

  }

}


/* =========================================================
   SEND BUTTON
   ========================================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================================================
   ENTER TO SEND
   ========================================================= */

input.addEventListener(
  "keydown",
  function(e){

    if(
      e.key==="Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   AUTO RESIZE
   ========================================================= */

input.addEventListener(
  "input",
  function(){

    this.style.height="auto";

    this.style.height=
      Math.min(
        this.scrollHeight,
        110
      )+"px";

  }
);


/* =========================================================
   SPEECH OUTPUT
   ========================================================= */

function speak(text){

  if(
    !text ||
    !("speechSynthesis" in window)
  ){

    return;

  }


  try{

    window.speechSynthesis.cancel();


    const utterance=
      new SpeechSynthesisUtterance(
        text
      );


    utterance.rate=1;

    utterance.pitch=1;

    utterance.volume=1;


    window.speechSynthesis.speak(
      utterance
    );


  }catch(error){

    console.log(
      "Speech output unavailable"
    );

  }

}


/* =========================================================
   VOICE INPUT
   ========================================================= */

const SpeechRecognition=
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let recognition=null;

let listening=false;


if(SpeechRecognition){

  recognition=
    new SpeechRecognition();


  recognition.lang="en-IN";

  recognition.continuous=false;

  recognition.interimResults=false;


  recognition.onstart=function(){

    listening=true;

    micBtn.classList.add(
      "listening"
    );

    micBtn.textContent="⏹";

  };


  recognition.onresult=
    function(event){

      const result=
        event.results[0][0]
          .transcript;


      input.value=result;


      input.dispatchEvent(
        new Event("input")
      );

    };


  recognition.onerror=
    function(event){

      console.log(
        "Speech recognition error:",
        event.error
      );

    };


  recognition.onend=function(){

    listening=false;

    micBtn.classList.remove(
      "listening"
    );

    micBtn.textContent="🎤";

  };


  micBtn.addEventListener(
    "click",
    function(){

      if(listening){

        recognition.stop();

        return;

      }


      try{

        recognition.start();

      }catch(error){

        console.log(error);

      }

    }
  );


}else{

  micBtn.addEventListener(
    "click",
    function(){

      alert(
        "Voice input is not supported by this browser."
      );

    }
  );

}


/* =========================================================
   LOAD SAVED CHAT
   ========================================================= */

try{

  const saved=
    localStorage.getItem(
      "sarvesh_ai_chat"
    );


  if(saved){

    conversation=
      JSON.parse(saved);


    conversation.forEach(
      function(item){

        if(
          item.role==="user" ||
          item.role==="assistant"
        ){

          /*
             Saved messages containing
             only text are restored normally.
          */

          addMessage(
            item.role,
            item.content
          );

        }

      }
    );

  }

}catch(error){

  console.log(
    "No saved chat"
  );

}


/* =========================================================
   SAVE CHAT
   ========================================================= */

setInterval(
  function(){

    try{

      localStorage.setItem(

        "sarvesh_ai_chat",

        JSON.stringify(
          conversation.slice(-30)
        )

      );

    }catch(error){

      console.log(
        "Could not save chat"
      );

    }

  },
  2000
);


/* =========================================================
   FOCUS
   ========================================================= */

input.focus();

</script></body>
</html>
